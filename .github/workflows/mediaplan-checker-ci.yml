name: Mediaplan Checker CI

on:
  push:
    branches: ["main", "fix/mediaplan-audit-precision", "fix/mediaplan-final-hardening", "fix/vernell-audit-precision", "fix/laska-final-polish", "fix/fa-audit-precision", "fix/no-budget-precision"]
    paths:
      - "mediaplan-checker/**"
      - ".github/workflows/mediaplan-checker-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "mediaplan-checker/**"
      - ".github/workflows/mediaplan-checker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Проверка синтаксиса
        run: |
          node --check mediaplan-checker/core.js
          node --check mediaplan-checker/precision.js
          node --check mediaplan-checker/lab-rules.js
          node --check mediaplan-checker/final-rules.js
          node --check mediaplan-checker/baseline-rules.js
          node --check mediaplan-checker/stability-rules.js
          node --check mediaplan-checker/hardening-rules.js
          node --check mediaplan-checker/hardening-text-rules.js
          node --check mediaplan-checker/reliability-rules.js
          node --check mediaplan-checker/audit-polish-rules.js
          node --check mediaplan-checker/fa-rules.js
          node --check mediaplan-checker/fa-final-rules.js
          node --check mediaplan-checker/audit-policy-rules.js
          node --check mediaplan-checker/xlsx-options.js
          node --check mediaplan-checker/app.js
      - name: Базовый smoke-тест
        run: node mediaplan-checker/tests/core.test.js
      - name: Регрессионный тест точности
        run: node -e "require('./mediaplan-checker/lab-rules.js'); require('./mediaplan-checker/tests/precision.test.js')"
      - name: Финальный регрессионный тест
        run: node mediaplan-checker/tests/final-rules.test.js
      - name: Базовый LAB-регрессионный тест
        run: node mediaplan-checker/tests/baseline-rules.test.js
      - name: Регрессионный тест стабильности по Ласке
        run: node mediaplan-checker/tests/stability-rules.test.js
      - name: Финальный hardening-регрессионный тест
        run: node mediaplan-checker/tests/hardening-rules.test.js
      - name: Reliability-регрессия по реальному Вернелю
        run: node mediaplan-checker/tests/reliability-rules.test.js
      - name: Финальная регрессия по реальной Ласке
        run: node mediaplan-checker/tests/audit-polish-rules.test.js
      - name: Регрессия по реальному ФА
        run: node mediaplan-checker/tests/fa-rules.test.js
