name: Mediaplan Checker CI

on:
  push:
    branches: ["main"]
    paths:
      - "mediaplan-checker/**"
      - ".github/workflows/mediaplan-checker-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "mediaplan-checker/**"
      - ".github/workflows/mediaplan-checker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Проверка синтаксиса
        run: |
          node --check mediaplan-checker/core.js
          node --check mediaplan-checker/brands.js
          node --check mediaplan-checker/app.js
      - name: Smoke-тест движка
        run: node mediaplan-checker/tests/core.test.js
