name: Rebuild embedded planner core

on:
  push:
    branches: ["main"]
    paths:
      - ".debug_sources/engine.py"
      - ".debug_sources/web_api.py"
      - ".debug_sources/xlsx_reader.py"
      - ".debug_sources/splits.py"
      - ".debug_sources/test_reach_engine.py"
      - ".debug_sources/test_web_api.py"
      - ".debug_sources/test_splits_core.py"
      - ".debug_sources/test_xlsx_reader.py"
      - "scripts/rebuild_embedded.py"
      - "scripts/verify_embedded.py"
      - "Makefile"
      - ".github/workflows/rebuild-embedded.yml"

permissions:
  contents: write

concurrency:
  group: "rebuild-embedded-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical legacy sources
        run: |
          PYTHONPATH=.debug_sources:. python -m py_compile \
            .debug_sources/engine.py \
            .debug_sources/web_api.py \
            .debug_sources/xlsx_reader.py \
            .debug_sources/splits.py \
            .debug_sources/test_reach_engine.py \
            .debug_sources/test_web_api.py \
            .debug_sources/test_splits_core.py \
            .debug_sources/test_xlsx_reader.py
          make test-legacy

      - name: Re-embed planner core into index.html
        run: make rebuild-embedded

      - name: Verify embedded core matches sources
        run: make verify-embedded

      - name: Commit rebuilt embedded core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild embedded planner core"

          # A UI-only commit can land while this short rebuild is running. Retry a
          # fast-forward/rebase instead of overwriting a concurrent index.html change.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "Concurrent change conflicts with rebuilt index.html; refusing to overwrite it."
              exit 1
            fi
          done
          echo "Could not push rebuilt core after 3 attempts."
          exit 1
