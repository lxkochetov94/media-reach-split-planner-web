name: Rebuild embedded planner core

on:
  push:
    branches: ["main"]
    paths:
      - ".debug_sources/engine.py"
      - ".debug_sources/web_api.py"
      - ".debug_sources/xlsx_reader.py"
      - ".debug_sources/splits.py"
      - ".debug_sources/test_reach_engine.py"
      - ".debug_sources/test_web_api.py"
      - ".debug_sources/test_splits_core.py"
      - ".debug_sources/test_xlsx_reader.py"
      - ".github/workflows/rebuild-embedded.yml"

permissions:
  contents: write

concurrency:
  group: "rebuild-embedded-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python sources
        run: |
          python -m py_compile \
            .debug_sources/engine.py \
            .debug_sources/web_api.py \
            .debug_sources/xlsx_reader.py \
            .debug_sources/splits.py \
            .debug_sources/test_reach_engine.py \
            .debug_sources/test_web_api.py \
            .debug_sources/test_splits_core.py \
            .debug_sources/test_xlsx_reader.py
          PYTHONPATH=.debug_sources python -m unittest -v \
            test_reach_engine \
            test_web_api \
            test_splits_core \
            test_xlsx_reader

      - name: Re-embed planner core into index.html
        run: |
          python - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          m = re.search(r'window\.MRP_ASSETS=(\{.*?\});</script>', html, flags=re.S)
          if not m:
              raise SystemExit("MRP_ASSETS not found")
          assets = json.loads(m.group(1))

          src = Path(".debug_sources")
          for name in ("engine.py", "web_api.py", "xlsx_reader.py", "splits.py"):
              raw = (src / name).read_bytes()
              assets[name] = base64.b64encode(gzip.compress(raw, compresslevel=9, mtime=0)).decode("ascii")

          block = "window.MRP_ASSETS=" + json.dumps(assets, ensure_ascii=False, separators=(",", ":")) + ";</script>"
          html = html[:m.start()] + block + html[m.end():]
          p.write_text(html, encoding="utf-8")
          PY

      - name: Verify embedded core matches sources
        run: |
          python - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          m = re.search(r'window\.MRP_ASSETS=(\{.*?\});</script>', html, flags=re.S)
          if not m:
              raise SystemExit("MRP_ASSETS not found after rebuild")
          assets = json.loads(m.group(1))
          for name in ("engine.py", "web_api.py", "xlsx_reader.py", "splits.py"):
              embedded = gzip.decompress(base64.b64decode(assets[name]))
              source = (Path(".debug_sources") / name).read_bytes()
              if embedded != source:
                  raise SystemExit(f"Embedded {name} does not match source")
          print("Embedded planner core matches canonical sources.")
          PY

      - name: Commit rebuilt embedded core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild embedded planner core"

          # A UI-only commit can land while this short rebuild is running. Retry a
          # fast-forward/rebase instead of failing the deployment on a harmless race.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "Concurrent change conflicts with rebuilt index.html; refusing to overwrite it."
              exit 1
            fi
          done
          echo "Could not push rebuilt core after 3 attempts."
          exit 1
