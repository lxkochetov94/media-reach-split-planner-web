name: Rebuild embedded planner core

on:
  push:
    branches: ["main"]
    paths:
      - ".debug_sources/engine.py"
      - ".debug_sources/web_api.py"
      - ".debug_sources/xlsx_reader.py"
      - ".github/workflows/rebuild-embedded.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python sources
        run: |
          python -m py_compile .debug_sources/engine.py .debug_sources/web_api.py .debug_sources/xlsx_reader.py
          python - <<'PY'
          import sys
          sys.path.insert(0, ".debug_sources")
          import engine

          U = 10_000_000.0
          parts = [
              {"target_1p": 6_000_000.0, "target_pct_1p": 0.60,
               "target_3p": 3_000_000.0, "target_pct_3p": 0.30},
              {"target_1p": 6_000_000.0, "target_pct_1p": 0.60,
               "target_3p": 3_000_000.0, "target_pct_3p": 0.30},
              {"target_1p": 6_000_000.0, "target_pct_1p": 0.60,
               "target_3p": 3_000_000.0, "target_pct_3p": 0.30},
          ]
          out = engine.combine_reach_union(parts, U, coefficient=0.85, frequencies=(1,3))
          assert 0 < out["target_pct_1p"] < 1.0, out
          assert 0 < out["target_pct_3p"] < out["target_pct_1p"], out
          expected = (1 - (1 - 0.60) ** 3) * 0.85
          assert abs(out["target_pct_1p"] - expected) < 1e-9, (out, expected)
          print("bounded union OK:", out)
          PY

      - name: Re-embed planner core into index.html
        run: |
          python - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          m = re.search(r'window\.MRP_ASSETS=(\{.*?\});</script>', html, flags=re.S)
          if not m:
              raise SystemExit("MRP_ASSETS not found")
          assets = json.loads(m.group(1))

          src = Path(".debug_sources")
          for name in ("engine.py", "web_api.py", "xlsx_reader.py"):
              raw = (src / name).read_bytes()
              assets[name] = base64.b64encode(gzip.compress(raw, compresslevel=9, mtime=0)).decode("ascii")

          block = "window.MRP_ASSETS=" + json.dumps(assets, ensure_ascii=False, separators=(",", ":")) + ";</script>"
          html = html[:m.start()] + block + html[m.end():]
          p.write_text(html, encoding="utf-8")
          PY

      - name: Commit rebuilt embedded core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild embedded planner core after reach fix"
          git push
