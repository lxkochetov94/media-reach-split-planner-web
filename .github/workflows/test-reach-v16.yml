name: Test Reach Engine v1.6

on:
  push:
    branches:
      - "feature/reach-engine-v16-tab"
      - "feature/reach-engine-v16-canonical-parity"
    paths:
      - "reach_v16.py"
      - "reach_v16_math.py"
      - "reach_v16.js"
      - "reach_v16.css"
      - "test_reach_v16.py"
      - "test_reach_v16_math.py"
      - "test_reach_v16_final_ux.py"
      - "test_reach_v16_lab_fixture.py"
      - "test_reach_v16_persil_battle.py"
      - "test_reach_v16_template_battle.py"
      - ".debug_sources/engine.py"
      - ".debug_sources/xlsx_reader.py"
      - "scripts/guard_reach_surface.py"
      - "scripts/docs_check.py"
      - "Makefile"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "docs/**"
      - "index.html"
      - ".github/workflows/test-reach-v16.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "reach_v16.py"
      - "reach_v16_math.py"
      - "reach_v16.js"
      - "reach_v16.css"
      - "test_reach_v16.py"
      - "test_reach_v16_math.py"
      - "test_reach_v16_final_ux.py"
      - "test_reach_v16_lab_fixture.py"
      - "test_reach_v16_persil_battle.py"
      - "test_reach_v16_template_battle.py"
      - ".debug_sources/engine.py"
      - ".debug_sources/xlsx_reader.py"
      - "scripts/guard_reach_surface.py"
      - "scripts/docs_check.py"
      - "Makefile"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "docs/**"
      - "index.html"
      - ".github/workflows/test-reach-v16.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reach Engine v1.6 verification
        run: make check-reach

      - name: Guard production 0.52 reach code
        run: |
          git fetch origin main
          make guard-reach-surface
