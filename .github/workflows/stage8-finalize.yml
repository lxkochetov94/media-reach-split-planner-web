name: Stage 8 finalize
on:
  push:
    branches: [stage-1-data-structure]
    paths:
      - tools/stage8_finalize.py
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-1-data-structure
      - name: Patch Stage 8
        run: python tools/stage8_finalize.py
      - name: Commit Stage 8 final
        run: |
          git config user.name "stage8-bot"
          git config user.email "stage8-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Stage 8: finalize multi-plan reach rules"
          git push origin HEAD:stage-1-data-structure
