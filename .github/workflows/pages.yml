name: Deploy Media Reach Planner to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Подготовить Budget Checker v1.2
        shell: bash
        run: |
          set -euo pipefail
          cat .budget-v12pkg/part-*.b64 > /tmp/budget-v12.b64
          base64 --decode /tmp/budget-v12.b64 > /tmp/budget-v12.tar.gz
          echo "25861e3dadc7fcb77c1efb6056241e53cad4aa7322940888649694b404186a5d  /tmp/budget-v12.tar.gz" | sha256sum -c -
          mkdir -p budget-checker/src
          tar -xzf /tmp/budget-v12.tar.gz -C budget-checker
          test -f budget-checker/index.html
          test -f budget-checker/styles.css
          test -f budget-checker/src/core.js
          test -f budget-checker/src/importer.js
          test -f budget-checker/src/excel.js
          test -f budget-checker/src/workspace.js
          test -f budget-checker/src/app.js
          rm -rf .budget-v12pkg

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Проверить опубликованный медиаплан-чекер
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lxkochetov94.github.io/media-reach-split-planner-web/mediaplan-checker"
          ok=0
          for attempt in {1..12}; do
            body="$(curl -fsSL --max-time 20 "$BASE/" || true)"
            app_js="$(curl -fsSL --max-time 20 "$BASE/app.js?v=20260916-6" || true)"
            audit_policy="$(curl -fsSL --max-time 20 "$BASE/audit-policy-rules.js?v=20260916-6" || true)"
            production_rules="$(curl -fsSL --max-time 20 "$BASE/production-rules.js?v=20260916-6" || true)"
            final_cleanup="$(curl -fsSL --max-time 20 "$BASE/final-cleanup-rules.js?v=20260916-6" || true)"
            if grep -Fq '<title>Проверка медиаплана</title>' <<<"$body" \
              && grep -Fq 'final-cleanup-rules.js?v=20260916-6' <<<"$body" \
              && grep -Fq 'app.js?v=20260916-6' <<<"$body" \
              && ! grep -Fq 'introText' <<<"$body" \
              && ! grep -Fq 'introText' <<<"$app_js" \
              && grep -Fq '__auditPolicyRulesPatched' <<<"$audit_policy" \
              && grep -Fq '__productionRulesPatched' <<<"$production_rules" \
              && grep -Fq '__finalCleanupRulesPatched' <<<"$final_cleanup"; then
              ok=1
              break
            fi
            sleep 5
          done
          if [[ "$ok" != "1" ]]; then
            echo "Опубликованная версия медиаплан-чекера не прошла smoke-test: $BASE/" >&2
            exit 1
          fi
          curl -fsSI --max-time 20 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js' >/dev/null
          curl -fsSI --max-time 20 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js' >/dev/null
          echo "Smoke-test GitHub Pages пройден: $BASE/"

      - name: Проверить опубликованный Budget Checker
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lxkochetov94.github.io/media-reach-split-planner-web/budget-checker"
          ok=0
          for attempt in {1..12}; do
            body="$(curl -fsSL --max-time 20 "$BASE/" || true)"
            core_js="$(curl -fsSL --max-time 20 "$BASE/src/core.js" || true)"
            excel_js="$(curl -fsSL --max-time 20 "$BASE/src/excel.js" || true)"
            if grep -Fq '<title>Контроль бюджетов</title>' <<<"$body" \
              && grep -Fq 'ANNUAL_ADJUSTMENT' <<<"$core_js" \
              && grep -Fq "'Свод'" <<<"$excel_js"; then
              ok=1
              break
            fi
            sleep 5
          done
          if [[ "$ok" != "1" ]]; then
            echo "Опубликованный Budget Checker не прошёл smoke-test: $BASE/" >&2
            exit 1
          fi
          echo "Smoke-test Budget Checker пройден: $BASE/"
