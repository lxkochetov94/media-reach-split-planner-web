name: Deploy Media Reach Planner to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Подготовить Budget Checker v1.2
        shell: bash
        run: |
          set -euo pipefail
          cat .budget-v12pkg/part-*.b64 > /tmp/budget-v12.b64
          base64 --decode /tmp/budget-v12.b64 > /tmp/budget-v12.tar.gz
          echo "25861e3dadc7fcb77c1efb6056241e53cad4aa7322940888649694b404186a5d  /tmp/budget-v12.tar.gz" | sha256sum -c -
          mkdir -p budget-checker/src
          tar -xzf /tmp/budget-v12.tar.gz -C budget-checker
          rm -rf .budget-v12pkg
          test -f budget-checker/index.html
          test -f budget-checker/styles.css
          test -f budget-checker/src/core.js
          test -f budget-checker/src/importer.js
          test -f budget-checker/src/excel.js
          test -f budget-checker/src/workspace.js
          test -f budget-checker/src/app.js

      - name: Собрать и проверить Budget Checker
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch_budget_import_autodetect.py budget-checker/src/app.js
          python scripts/patch_budget_import_ux.py budget-checker/src/app.js
          python scripts/patch_budget_current_ui.py budget-checker/src/app.js budget-checker/styles.css
          python scripts/patch_budget_inline_edit.py budget-checker/src/app.js budget-checker/styles.css
          python scripts/patch_budget_inline_edit_fix.py budget-checker/src/app.js
          python scripts/patch_budget_workspace_ux.py budget-checker/src/app.js budget-checker/styles.css
          python scripts/patch_budget_workspace_v2.py budget-checker/src/app.js budget-checker/styles.css
          python scripts/check_budget_workspace_v2.py budget-checker/src/app.js budget-checker/styles.css
          python scripts/patch_budget_workspace_v3.py budget-checker/src/app.js budget-checker/styles.css
          python scripts/check_budget_workspace_v3.py budget-checker/src/app.js budget-checker/styles.css
          python scripts/patch_budget_mediaplan_reuse.py budget-checker/index.html budget-checker/src/app.js budget-checker/styles.css
          python scripts/check_budget_mediaplan_reuse.py budget-checker/index.html budget-checker/src/app.js mediaplan-checker/production-rules.js
          node mediaplan-checker/tests/production-rules.test.js
          node --check budget-checker/src/app.js
          grep -Fq 'HEADER_MONTH_ALIASES' budget-checker/src/app.js
          grep -Fq 'guessDataStartRow' budget-checker/src/app.js
          grep -Fq 'guessTotalRules' budget-checker/src/app.js
          grep -Fq 'Настроить импорт вручную' budget-checker/src/app.js
          grep -Fq 'Итого до НДС, ₽' budget-checker/src/app.js
          grep -Fq 'data-budget-edit' budget-checker/src/app.js
          grep -Fq 'Выгрузить весь бюджет' budget-checker/src/app.js
          grep -Fq 'Выгрузить выделенное' budget-checker/src/app.js
          grep -Fq 'budgetSelectedPaths' budget-checker/src/app.js
          grep -Fq 'openBudgetNewLineModal' budget-checker/src/app.js
          grep -Fq 'openBudgetRedistributeModal' budget-checker/src/app.js
          grep -Fq 'Комментарий <span class="required-mark">обязательно' budget-checker/src/app.js
          grep -Fq 'resultingBudget=isAdjustment?' budget-checker/src/app.js
          grep -Fq 'Unified budget workspace UX' budget-checker/styles.css
          grep -Fq 'Budget workspace UX v2' budget-checker/src/app.js
          grep -Fq 'Выгрузить отфильтрованное' budget-checker/src/app.js
          grep -Fq 'budgetStructuralFilters' budget-checker/src/app.js
          grep -Fq 'data-budget-collapse' budget-checker/src/app.js
          grep -Fq 'История ячейки' budget-checker/src/app.js
          grep -Fq 'Budget workspace UX v3' budget-checker/src/app.js
          grep -Fq 'budgetSeedInitialCollapse' budget-checker/src/app.js
          grep -Fq 'budgetDraftStructuralFilters' budget-checker/src/app.js
          grep -Fq 'LAB mediaplan checker reuse v1' budget-checker/src/app.js
          grep -Fq 'extractBudgetPlacements' mediaplan-checker/production-rules.js
          grep -Fq '../mediaplan-checker/production-rules.js' budget-checker/index.html
          ! grep -Fq "['change','Внести изменение']" budget-checker/src/app.js
          ! grep -Fq "['redistribute','Перераспределить бюджет']" budget-checker/src/app.js
          ! grep -Fq "['flowchart','Сверить флоучарт']" budget-checker/src/app.js
          ! grep -Fq "['save','Сохранить']" budget-checker/src/app.js
          cd budget-checker
          npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Проверить существующий медиаплан-чекер
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lxkochetov94.github.io/media-reach-split-planner-web/mediaplan-checker"
          ok=0
          for attempt in {1..12}; do
            body="$(curl -fsSL --max-time 20 "$BASE/" || true)"
            app_js="$(curl -fsSL --max-time 20 "$BASE/app.js?v=20260916-6" || true)"
            production_js="$(curl -fsSL --max-time 20 "$BASE/production-rules.js" || true)"
            if grep -Fq '<title>Проверка медиаплана</title>' <<<"$body" \
              && grep -Fq 'app.js?v=20260916-6' <<<"$body" \
              && grep -Fq 'extractBudgetPlacements' <<<"$production_js" \
              && ! grep -Fq 'introText' <<<"$app_js"; then
              ok=1
              break
            fi
            sleep 5
          done
          [[ "$ok" == "1" ]] || { echo "Медиаплан-чекер не прошёл smoke-test" >&2; exit 1; }

      - name: Проверить опубликованный Budget Checker
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lxkochetov94.github.io/media-reach-split-planner-web/budget-checker"
          ok=0
          for attempt in {1..12}; do
            body="$(curl -fsSL --max-time 20 "$BASE/" || true)"
            app_js="$(curl -fsSL --max-time 20 "$BASE/src/app.js" || true)"
            core_js="$(curl -fsSL --max-time 20 "$BASE/src/core.js" || true)"
            css="$(curl -fsSL --max-time 20 "$BASE/styles.css" || true)"
            production_js="$(curl -fsSL --max-time 20 "https://lxkochetov94.github.io/media-reach-split-planner-web/mediaplan-checker/production-rules.js" || true)"
            if grep -Fq '<title>Контроль бюджетов</title>' <<<"$body" \
              && grep -Fq 'ANNUAL_ADJUSTMENT' <<<"$core_js" \
              && grep -Fq 'HEADER_MONTH_ALIASES' <<<"$app_js" \
              && grep -Fq 'guessDataStartRow' <<<"$app_js" \
              && grep -Fq 'Настроить импорт вручную' <<<"$app_js" \
              && grep -Fq 'Итого до НДС, ₽' <<<"$app_js" \
              && grep -Fq 'data-budget-edit' <<<"$app_js" \
              && grep -Fq 'Выгрузить выделенное' <<<"$app_js" \
              && grep -Fq 'budgetSelectedPaths' <<<"$app_js" \
              && grep -Fq 'openBudgetNewLineModal' <<<"$app_js" \
              && grep -Fq 'openBudgetRedistributeModal' <<<"$app_js" \
              && grep -Fq 'budget-history-popover' <<<"$app_js" \
              && grep -Fq 'resultingBudget=isAdjustment?' <<<"$app_js" \
              && grep -Fq 'Unified budget workspace UX' <<<"$css" \
              && grep -Fq 'Budget workspace UX v2' <<<"$app_js" \
              && grep -Fq 'Выгрузить отфильтрованное' <<<"$app_js" \
              && grep -Fq 'budgetStructuralFilters' <<<"$app_js" \
              && grep -Fq 'data-budget-collapse' <<<"$app_js" \
              && grep -Fq 'История ячейки' <<<"$app_js" \
              && grep -Fq 'Budget workspace UX v3' <<<"$app_js" \
              && grep -Fq 'budgetSeedInitialCollapse' <<<"$app_js" \
              && grep -Fq 'budgetDraftStructuralFilters' <<<"$app_js" \
              && grep -Fq 'LAB mediaplan checker reuse v1' <<<"$app_js" \
              && grep -Fq '../mediaplan-checker/production-rules.js' <<<"$body" \
              && grep -Fq 'extractBudgetPlacements' <<<"$production_js" \
              && ! grep -Fq "['change','Внести изменение']" <<<"$app_js" \
              && ! grep -Fq "['redistribute','Перераспределить бюджет']" <<<"$app_js" \
              && ! grep -Fq "['flowchart','Сверить флоучарт']" <<<"$app_js" \
              && ! grep -Fq "['save','Сохранить']" <<<"$app_js"; then
              ok=1
              break
            fi
            sleep 5
          done
          [[ "$ok" == "1" ]] || { echo "Budget Checker не прошёл smoke-test" >&2; exit 1; }
          echo "Budget Checker опубликован: $BASE/"
