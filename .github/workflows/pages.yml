name: Deploy Media Reach Planner to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Проверить опубликованный медиаплан-чекер
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lxkochetov94.github.io/media-reach-split-planner-web/mediaplan-checker"
          ok=0
          for attempt in {1..12}; do
            body="$(curl -fsSL --max-time 20 "$BASE/" || true)"
            app_js="$(curl -fsSL --max-time 20 "$BASE/app.js?v=20260916-4" || true)"
            fa_final="$(curl -fsSL --max-time 20 "$BASE/fa-final-rules.js?v=20260916-4" || true)"
            audit_policy="$(curl -fsSL --max-time 20 "$BASE/audit-policy-rules.js?v=20260916-4" || true)"
            if grep -Fq '<title>Проверка медиаплана</title>' <<<"$body" \
              && grep -Fq 'audit-policy-rules.js?v=20260916-4' <<<"$body" \
              && grep -Fq 'app.js?v=20260916-4' <<<"$body" \
              && ! grep -Fq 'introText' <<<"$body" \
              && ! grep -Fq 'introText' <<<"$app_js" \
              && grep -Fq '__faFinalRulesPatched' <<<"$fa_final" \
              && grep -Fq '__auditPolicyRulesPatched' <<<"$audit_policy"; then
              ok=1
              break
            fi
            sleep 5
          done
          if [[ "$ok" != "1" ]]; then
            echo "Опубликованная версия медиаплан-чекера не прошла smoke-test: $BASE/" >&2
            exit 1
          fi
          curl -fsSI --max-time 20 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js' >/dev/null
          curl -fsSI --max-time 20 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js' >/dev/null
          echo "Smoke-test GitHub Pages пройден: $BASE/"
